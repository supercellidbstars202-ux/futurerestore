name: Futurerestore

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'
    - cron: '0 0 1 4 *'
    - cron: '0 0 30 6 *'
    - cron: '0 0 28 9 *'
    - cron: '0 0 27 12 *'

jobs:
  macOS:
    # We MUST use Intel architecture because your scripts extract 'bootstrap_x86_64.tar.zst'
    runs-on: macos-15-intel
    steps:
    - name: Checkout
      id: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Select Oldest Supported Xcode
      id: Update-Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        # Xcode 15.4 is the absolute oldest toolchain present on modern Intel images
        xcode-version: '15.4'

    - name: Install Build Dependencies & Setup Paths
      run: |
        # Force-install command line utilities that your script calls
        brew install zstd cmake gnu-tar

        # Map out PROCURSUS safely 
        PROCURSUS="/opt/procursus"
        echo "PROCURSUS=$PROCURSUS" >> $GITHUB_ENV
        
        # We structurally preserve your legacy $PATH string, but append system $PATH so 'cmake' can be seen!
        echo "PATH=$PROCURSUS/bin:$PROCURSUS/libexec/gnubin:/usr/local/lib/ruby/gems/2.7.0/bin:/usr/local/opt/ruby@2.7/bin:/usr/local/opt/pipx_bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Users/runner/.yarn/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH" >> $GITHUB_ENV
        
        # COMPILER COMPATIBILITY FLAGS: Tell Xcode 15 to build code exactly like macOS 12/13 did
        echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
        echo "CFLAGS=-Wno-error=implicit-function-declaration -Wno-error=unsupported-cb -Wno-deprecated-declarations" >> $GITHUB_ENV
        echo "CXXFLAGS=-Wno-error=implicit-function-declaration -Wno-error=unsupported-cb -Wno-deprecated-declarations" >> $GITHUB_ENV

    - name: macOS Build
      id: macOS-Build
      run: |
        # Ensure workspace subfolders are explicitly established for output storage
        mkdir -p .github/workflows
        
        ${{ github.workspace }}/.github/workflows/mac-bootstrap.sh
        ${{ github.workspace }}/.github/workflows/mac-build.sh
        ${{ github.workspace }}/.github/workflows/mac-post.sh

    - name: Versioning
      id: Versioning
      uses: actions/upload-artifact@v4
      with:
        name: Versioning
        path: |
          ${{ github.workspace }}/latest_build_sha.txt
          ${{ github.workspace }}/latest_build_num.txt

    - name: macOS RELEASE Archive
      id: macOS-RELEASE-Archive
      uses: actions/upload-artifact@v4
      with:
        name: futurerestore-macOS-RELEASE
        path: ${{ github.workspace }}/futurerestore-macOS-*-RELEASE.tar.xz

    - name: macOS DEBUG Archive
      id: macOS-DEBUG-Archive
      uses: actions/upload-artifact@v4
      with:
        name: futurerestore-macOS-DEBUG
        path: ${{ github.workspace }}/futurerestore-macOS-*-DEBUG.tar.xz

    - name: macOS ASAN Archive
      id: macOS-ASAN-Archive
      uses: actions/upload-artifact@v4
      with:
        name: futurerestore-macOS-ASAN
        path: ${{ github.workspace }}/futurerestore-macOS-*-ASAN.tar.xz

  Linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Linux Build
        id: Linux
        uses: addnab/docker-run-action@v3
        with:
          image: debian:buster-slim
          options: -v ${{ github.workspace }}/..:/tmp/Builder/repos/
          run: |
            /tmp/Builder/repos/futurerestore/.github/workflows/linux-bootstrap.sh
            /tmp/Builder/repos/futurerestore/.github/workflows/linux-build.sh
            /tmp/Builder/repos/futurerestore/.github/workflows/linux-post.sh
            mkdir -p ${{ github.workspace }}/.github/workflows/

      - name: Linux x86_64 RELEASE Build
        id: Linux-x86_64-RELEASE-Build
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}/../
          mv ${{ github.workspace }}/.github/workflows/futurerestore1.tar.xz ${{ github.workspace }}/.github/workflows/$(cat ${{ github.workspace }}/.github/workflows/name1.txt)

      - name: Linux x86_64 DEBUG Build
        id: Linux-x86_64-DEBUG-Build
        run: |
          mv ${{ github.workspace }}/.github/workflows/futurerestore2.tar.xz ${{ github.workspace }}/.github/workflows/$(cat ${{ github.workspace }}/.github/workflows/name2.txt)

      - name: Linux x86_64 ASAN Build
        id: Linux-x86_64-ASAN-Build
        run: |
          mv ${{ github.workspace }}/.github/workflows/futurerestore3.tar.xz ${{ github.workspace }}/.github/workflows/$(cat ${{ github.workspace }}/.github/workflows/name3.txt)

      - name: futurerestore Linux x86_64 RELEASE Archive
        id: futurerestore-Linux-x86_64-RELEASE-Archive
        uses: actions/upload-artifact@v4
        with:
          name: futurerestore-Linux-x86_64-RELEASE
          path: ${{ github.workspace }}/.github/workflows/futurerestore-Linux-x86_64*-RELEASE.tar.xz

      - name: futurerestore Linux x86_64 DEBUG Archive
        id: futurerestore-Linux-x86_64-DEBUG-Archive
        uses: actions/upload-artifact@v4
        with:
          name: futurerestore-Linux-x86_64-DEBUG
          path: ${{ github.workspace }}/.github/workflows/futurerestore-Linux-x86_64*-DEBUG.tar.xz

      - name: futurerestore Linux x86_64 ASAN Archive
        id: futurerestore-Linux-x86_64-ASAN-Archive
        uses: actions/upload-artifact@v4
        with:
          name: futurerestore-Linux-x86_64-ASAN
          path: ${{ github.workspace }}/.github/workflows/futurerestore-Linux-x86_64*-ASAN.tar.xz
