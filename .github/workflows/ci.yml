name: Futurerestore

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'
    - cron: '0 0 1 4 *'
    - cron: '0 0 30 6 *'
    - cron: '0 0 28 9 *'
    - cron: '0 0 27 12 *'

jobs:
  macOS:
    runs-on: macos-14
    steps:
    - name: Checkout
      id: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Select Xcode 15 for Legacy Toolchain
      id: Update-Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Install Build Dependencies & Setup Paths
      run: |
        # Install standard core dependencies
        brew install zstd cmake gnu-tar pkg-config libplist libimobiledevice libirecovery libusb libimobiledevice-glue libzip autoconf automake libtool openssl@3 binutils

        # Establish PROCURSUS target directory
        PROCURSUS="/opt/procursus"
        echo "PROCURSUS=$PROCURSUS" >> $GITHUB_ENV
        
        # Inject paths safely
        echo "PATH=$PROCURSUS/bin:$PROCURSUS/libexec/gnubin:/usr/local/lib/ruby/gems/2.7.0/bin:/usr/local/opt/ruby@2.7/bin:/usr/local/opt/pipx_bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Users/runner/.yarn/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH" >> $GITHUB_ENV
        
        # Expose Homebrew paths alongside local system roots globally across all steps
        echo "CPATH=/opt/homebrew/include:/usr/local/include:$CPATH" >> $GITHUB_ENV
        echo "LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:$LIBRARY_PATH" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        
        # LEGACY FLAGS: Loosen compiler strictness rules
        echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
        echo "CFLAGS=-Wno-error=implicit-function-declaration -Wno-error=unsupported-cb -Wno-deprecated-declarations -I/opt/homebrew/include -I/usr/local/include" >> $GITHUB_ENV
        echo "CXXFLAGS=-Wno-error=implicit-function-declaration -Wno-error=unsupported-cb -Wno-deprecated-declarations -I/opt/homebrew/include -I/usr/local/include" >> $GITHUB_ENV

    - name: Build Missing Legacy Sub-Dependencies (libfragmentzip, img4tool, libpatchfinder, libipatcher)
      run: |
        # 1. Build libgeneral
        git clone https://github.com/tihmstar/libgeneral.git
        cd libgeneral && ./autogen.sh && make && sudo make install && cd ..

        # 2. Build libfragmentzip
        git clone https://github.com/tihmstar/libfragmentzip.git
        cd libfragmentzip && ./autogen.sh && make && sudo make install && cd ..

        # 3. Build img4tool
        git clone --recursive https://github.com/tihmstar/img4tool.git
        cd img4tool && ./autogen.sh && make && sudo make install && cd ..

        # 4. Build libpatchfinder (Required by libipatcher)
        git clone --recursive https://github.com/tihmstar/libpatchfinder.git
        cd libpatchfinder && ./autogen.sh && make && sudo make install && cd ..

        # 5. Build libipatcher
        git clone --recursive https://github.com/tihmstar/libipatcher.git
        cd libipatcher && ./autogen.sh && make && sudo make install && cd ..

    - name: macOS Build
      id: macOS-Build
      run: |
        mkdir -p .github/workflows
        
        ${{ github.workspace }}/.github/workflows/mac-bootstrap.sh
        ${{ github.workspace }}/.github/workflows/mac-build.sh
        ${{ github.workspace }}/.github/workflows/mac-post.sh

    - name: Versioning
      id: Versioning
      uses: actions/upload-artifact@v4
      with:
        name: Versioning
        path: |
          ${{ github.workspace }}/latest_build_sha.txt
          ${{ github.workspace }}/latest_build_num.txt

    - name: macOS RELEASE Archive
      id: macOS-RELEASE-Archive
      uses: actions/upload-artifact@v4
      with:
        name: futurerestore-macOS-RELEASE
        path: ${{ github.workspace }}/futurerestore-macOS-*-RELEASE.tar.xz

    - name: macOS DEBUG Archive
      id: macOS-DEBUG-Archive
      uses: actions/upload-artifact@v4
      with:
        name: futurerestore-macOS-DEBUG
        path: ${{ github.workspace }}/futurerestore-macOS-*-DEBUG.tar.xz

    - name: macOS ASAN Archive
      id: macOS-ASAN-Archive
      uses: actions/upload-artifact@v4
      with:
        name: futurerestore-macOS-ASAN
        path: ${{ github.workspace }}/futurerestore-macOS-*-ASAN.tar.xz
